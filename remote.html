<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle Remoto - Roleta IdeAlize</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      touch-action: manipulation;
    }
    .remote-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 24px;
      padding: 1.5rem 1.25rem;
      backdrop-filter: blur(18px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      text-align: center;
    }
    .remote-logo {
      height: 52px;
      background: rgba(255, 255, 255, 0.95);
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid rgba(251, 145, 56, 0.4);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4757;
      box-shadow: 0 0 8px #ff4757;
    }
    .status-dot.connected {
      background: #00e676;
      box-shadow: 0 0 8px #00e676;
    }
    .remote-input-group {
      width: 100%;
      text-align: left;
    }
    .remote-input-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--gold-text);
      margin-bottom: 0.4rem;
    }
    .remote-input {
      width: 100%;
      background: rgba(0, 26, 12, 0.85);
      border: 1.5px solid rgba(251, 145, 56, 0.4);
      border-radius: 14px;
      padding: 0.95rem 1.1rem;
      font-size: 1.1rem;
      color: #fff;
      font-family: inherit;
      outline: none;
    }
    .remote-input:focus {
      border-color: var(--brand-orange);
      box-shadow: 0 0 16px rgba(251, 145, 56, 0.4);
    }
    /* Grande botão tátil de giro */
    .btn-giant-spin {
      width: 100%;
      padding: 1.4rem 1rem;
      border-radius: 20px;
      border: none;
      background: linear-gradient(135deg, #fb9138 0%, #f57c00 50%, #e65100 100%);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(251, 145, 56, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }
    .btn-giant-spin:active:not(:disabled) {
      transform: scale(0.96);
      box-shadow: 0 5px 15px rgba(251, 145, 56, 0.4);
    }
    .btn-giant-spin:disabled {
      opacity: 0.6;
      filter: grayscale(0.5);
      cursor: not-allowed;
    }
    .btn-subtitle {
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffe0b2;
      letter-spacing: 0.02em;
    }
    /* Card de Vitória no Celular */
    .mobile-winner-card {
      display: none;
      width: 100%;
      background: linear-gradient(135deg, rgba(251, 145, 56, 0.2) 0%, rgba(0, 91, 42, 0.3) 100%);
      border: 2px dashed var(--brand-orange);
      border-radius: 18px;
      padding: 1.25rem;
      animation: bounce 0.5s ease;
    }
    .mobile-winner-card.show {
      display: block;
    }
    .room-badge {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div class="remote-card">
    <img src="assets/logo_idealize.png" alt="IdeAlize Imobiliária" class="remote-logo">

    <div class="status-pill">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Conectando à TV...</span>
    </div>

    <div class="remote-input-group">
      <label for="client-name">Nome do Cliente / Unidade:</label>
      <input type="text" id="client-name" class="remote-input" placeholder="Ex: Lucas & Mariana (Apto 301)" autocomplete="off">
    </div>

    <button id="btn-remote-spin" class="btn-giant-spin">
      <span>GIRAR NA TV! 🚀</span>
      <span class="btn-subtitle">Dispare a roleta do estande agora</span>
    </button>

    <div id="mobile-winner-box" class="mobile-winner-card">
      <div style="font-size: 2.2rem; margin-bottom: 0.4rem;">🎉</div>
      <div style="font-size: 0.85rem; font-weight: 800; color: #ffd700;">CONTEMPLADO NA TV:</div>
      <div id="winner-client-txt" style="font-size: 1.15rem; font-weight: 700; color: #fff; margin: 0.2rem 0;">Cliente VIP</div>
      <div id="winner-prize-txt" style="font-size: 1.6rem; font-weight: 900; color: #fb9138;">Air Fryer Digital</div>
      <p style="font-size: 0.85rem; color: #cbd5e1; margin-top: 0.4rem;">Parabéns pelo novo lar!</p>
    </div>

    <div class="room-badge">
      SALA CONECTADA: <strong id="room-code-display" style="color: var(--brand-orange);">...</strong>
    </div>
  </div>

  <script src="assets/paho-mqtt.min.js"></script>
  <script>
    // Recuperar código da sala da URL (?room=XXXX)
    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = (urlParams.get('room') || 'default').toUpperCase();
    document.getElementById('room-code-display').textContent = roomCode;

    const topic = `idealize/roleta/${roomCode}`;
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const btnSpin = document.getElementById('btn-remote-spin');
    const clientInput = document.getElementById('client-name');
    const winnerBox = document.getElementById('mobile-winner-box');
    const winnerClient = document.getElementById('winner-client-txt');
    const winnerPrize = document.getElementById('winner-prize-txt');

    let client = null;
    let isConnected = false;

    function connectMQTT() {
      const clientId = `remote_${roomCode}_${Math.random().toString(16).substr(2, 6)}`;
      client = new Paho.MQTT.Client('broker.emqx.io', 8084, '/mqtt', clientId);

      client.onConnectionLost = (responseObject) => {
        isConnected = false;
        statusDot.classList.remove('connected');
        statusText.textContent = 'Reconectando à TV...';
        btnSpin.disabled = true;
        setTimeout(connectMQTT, 2500);
      };

      client.onMessageArrived = (message) => {
        try {
          const data = JSON.parse(message.payloadString);
          if (data.action === 'spinning') {
            btnSpin.disabled = true;
            btnSpin.querySelector('span:first-child').textContent = 'GIRANDO NA TV... ⏳';
            if (navigator.vibrate) navigator.vibrate(80);
          } else if (data.action === 'winner') {
            btnSpin.disabled = false;
            btnSpin.querySelector('span:first-child').textContent = 'GIRAR NOVAMENTE 🚀';
            winnerClient.textContent = data.clientName || 'Novo Morador';
            winnerPrize.textContent = data.prize;
            winnerBox.classList.add('show');
            if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const options = {
        useSSL: true,
        timeout: 5,
        onSuccess: () => {
          isConnected = true;
          statusDot.classList.add('connected');
          statusText.textContent = '🟢 Conectado à TV!';
          btnSpin.disabled = false;
          client.subscribe(topic);

          // Enviar aviso de que o celular conectou
          const msg = new Paho.MQTT.Message(JSON.stringify({ action: 'phone_connected' }));
          msg.destinationName = topic;
          client.send(msg);
        },
        onFailure: (err) => {
          statusText.textContent = 'Falha ao conectar. Tentando novamente...';
          setTimeout(connectMQTT, 3000);
        }
      };

      client.connect(options);
    }

    btnSpin.addEventListener('click', () => {
      if (!isConnected) {
        alert('Aguardando conexão com a TV...');
        return;
      }

      const clientName = clientInput.value.trim() || 'Cliente VIP';
      const payload = JSON.stringify({
        action: 'spin_request',
        clientName: clientName,
        timestamp: Date.now()
      });

      const message = new Paho.MQTT.Message(payload);
      message.destinationName = topic;
      client.send(message);

      btnSpin.disabled = true;
      btnSpin.querySelector('span:first-child').textContent = 'DISPARANDO GIRO... 🎯';
      if (navigator.vibrate) navigator.vibrate(100);
    });

    connectMQTT();
  </script>
</body>
</html>
